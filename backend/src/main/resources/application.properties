spring.devtools.add-properties=true
jwt.secret.key.base64=${JWT_SECRET_KEY_BASE64}
firebase.storage.bucket.name=${STORAGE_BUCKET_NAME:inf5190-chat-e1b0d.firebasestorage.app}
server.error.include-stacktrace=never
# --- Anonymis ---
privacy.engine.url=${PRIVACY_ENGINE_URL:http://127.0.0.1:8090}
# gemini (Gemma 4 en ligne, Google AI Studio) | ollama (Gemma 4 en local)
llm.provider=${LLM_PROVIDER:gemini}
llm.gemini.url=${GEMINI_URL:https://generativelanguage.googleapis.com/v1beta}
llm.gemini.model=${GEMINI_MODEL:gemma-4-26b-a4b-it}
llm.gemini.thinking-level=${GEMINI_THINKING_LEVEL:minimal}
llm.ollama.url=${OLLAMA_URL:http://localhost:11434}
llm.ollama.model=${OLLAMA_MODEL:gemma4:e4b}
llm.ollama.num-ctx=${OLLAMA_NUM_CTX:32768}
llm.ollama.think=${OLLAMA_THINK:false}
spring.servlet.multipart.max-file-size=30MB
spring.servlet.multipart.max-request-size=30MB
